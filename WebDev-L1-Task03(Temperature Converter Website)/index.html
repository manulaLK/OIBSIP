<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter | Oasis Infobyte Task 3</title>
    
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Animation Framework -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: {
                            400: '#1e293b',
                            500: '#0f172a',
                            600: '#0b1329',
                            700: '#090d1a',
                            800: '#070a13',
                            900: '#02040a',
                        },
                        accent: {
                            cyan: '#22d3ee',
                            blue: '#3b82f6',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #070a13;
            background-image:
                radial-gradient(circle at 12% 18%, rgba(34, 211, 238, 0.07) 0%, transparent 42%),
                radial-gradient(circle at 88% 82%, rgba(59, 130, 246, 0.08) 0%, transparent 42%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .gradient-text {
            background: linear-gradient(to right, #22d3ee, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .glass {
            background: rgba(9, 13, 26, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(30, 41, 59, 0.6);
        }

        .grid-pattern {
            background-image:
                linear-gradient(rgba(34, 211, 238, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.04) 1px, transparent 1px);
            background-size: 48px 48px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: linear-gradient(to right, #22d3ee, #3b82f6);
            color: #02040a;
            font-weight: 700;
            padding: 0.875rem 1.75rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 20px -2px rgba(34, 211, 238, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-primary:hover {
            box-shadow: 0 8px 30px -2px rgba(34, 211, 238, 0.6);
            transform: translateY(-2px);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="text-slate-100 font-sans antialiased grid-pattern flex flex-col justify-between items-center p-4 sm:p-6">

    <!-- Top Navigation Header -->
    <header class="w-full max-w-4xl flex justify-between items-center py-4 mb-8">
        <div class="text-xs font-bold tracking-wider text-accent-cyan bg-accent-cyan/10 border border-accent-cyan/20 px-3 py-1 rounded-full uppercase">
            Oasis Infobyte Task 3
        </div>
    </header>

    <!-- Main Converter App Interface -->
    <main class="w-full max-w-md glass rounded-2xl p-6 sm:p-8 shadow-2xl animate__animated animate__fadeInUp">
        <div class="text-center mb-8">
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight mb-2">
                Temperature <span class="gradient-text">Converter</span>
            </h1>
            <p class="text-xs sm:text-sm text-slate-400">
                Enter a degree value, select units, and calculate instantaneous conversions.
            </p>
        </div>

        <form id="calc-form" onsubmit="event.preventDefault(); convertTemperature();" class="space-y-6">
            <!-- Degrees Input -->
            <div>
                <label for="tempInput" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Degrees</label>
                <input 
                    type="number" 
                    step="any" 
                    id="tempInput" 
                    placeholder="e.g. 32" 
                    required 
                    class="w-full bg-ink-900/80 border border-ink-400/60 p-3.5 rounded-xl text-slate-100 placeholder-slate-600 outline-none transition-all focus:border-accent-cyan focus:ring-1 focus:ring-accent-cyan"
                >
            </div>

            <!-- Unit Selectors Grid -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="fromUnit" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">From</label>
                    <select id="fromUnit" class="w-full bg-ink-900/80 border border-ink-400/60 p-3 rounded-xl text-slate-100 outline-none transition-colors focus:border-accent-cyan cursor-pointer">
                        <option value="C" selected>Celsius (°C)</option>
                        <option value="F">Fahrenheit (°F)</option>
                        <option value="K">Kelvin (K)</option>
                    </select>
                </div>

                <div>
                    <label for="toUnit" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">To</label>
                    <select id="toUnit" class="w-full bg-ink-900/80 border border-ink-400/60 p-3 rounded-xl text-slate-100 outline-none transition-colors focus:border-accent-cyan cursor-pointer">
                        <option value="F" selected>Fahrenheit (°F)</option>
                        <option value="C">Celsius (°C)</option>
                        <option value="K">Kelvin (K)</option>
                    </select>
                </div>
            </div>

            <!-- Conversion Action Button -->
            <button type="submit" class="btn-primary w-full py-3.5 text-base">
                Convert Temperature ⚡
            </button>
        </form>

        <!-- Result Box Output -->
        <div id="resultBox" class="mt-8 p-4 rounded-xl bg-ink-900/60 border border-ink-400/60 text-center transition-all">
            <span class="text-xs text-slate-400 uppercase tracking-wider block mb-1">Converted Result</span>
            <p id="resultDisplay" class="text-lg font-bold text-slate-200">Enter a value to begin</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-12 text-center text-xs text-slate-500">
        Developed by <span class="text-slate-300 font-medium">Manula Gunawardhana</span> &bull; Web Development Internship
    </footer>

    <!-- External Script Import -->
    <script src="script.js"></script>
</body>
</html>
